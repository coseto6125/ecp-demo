[package]
name = "ecp-demo"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Public web demo of ecp: paste a GitHub repository, get the read-only MCP tool surface against its code graph"
repository = "https://github.com/coseto6125/ecp-demo"
publish = false

[dependencies]
anyhow = "1.0"
axum = "0.8"
include_dir = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "signal", "sync", "fs"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
